<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ambient Glow & Drop Shadow Filters -->
    <filter id="sefronCoreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sefronBadgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Luxury Metallic Obsidian / Titanium Gradients -->
    <linearGradient id="sefronTitaniumDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="35%" stop-color="#0a1426" />
      <stop offset="70%" stop-color="#0f223d" />
      <stop offset="100%" stop-color="#050e1d" />
    </linearGradient>

    <linearGradient id="sefronTitaniumSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2c44" />
      <stop offset="45%" stop-color="#121e33" />
      <stop offset="100%" stop-color="#08101e" />
    </linearGradient>

    <!-- Luxury Machined Platinum Bevel Sheen -->
    <linearGradient id="sefronPlatinumRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#94a3b8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Dynamic Electric Cyan / Azure Sapphire Core -->
    <linearGradient id="sefronElectricCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="45%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#0051ff" />
    </linearGradient>

    <linearGradient id="sefronElectricCyanRev" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#0038cc" />
    </linearGradient>

    <linearGradient id="sefronSpecularGlint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="sefronBadgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="sefronBacklight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#040814" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Luxury Squircle Emblem Badge -->
  <g filter="url(#sefronBadgeShadow)">
    <rect
      x="24"
      y="24"
      width="452"
      height="452"
      rx="110"
      ry="110"
      fill="url(#sefronTitaniumDeep)"
      stroke="url(#sefronBadgeBorder)"
      stroke-width="2.5"
    />

    <rect
      x="36"
      y="36"
      width="428"
      height="428"
      rx="98"
      ry="98"
      fill="url(#sefronBacklight)"
      stroke="rgba(255, 255, 255, 0.08)"
      stroke-width="1.2"
    />

    <!-- High-Precision Horology Tick Marks -->
    <line x1="250" y1="36" x2="250" y2="48" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="250" y1="452" x2="250" y2="464" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="36" y1="250" x2="48" y2="250" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="452" y1="250" x2="464" y2="250" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />

    <circle
      cx="250"
      cy="250"
      r="200"
      stroke="rgba(255, 255, 255, 0.04)"
      stroke-width="1"
      stroke-dasharray="4 12"
    />
  </g>

  <!-- 2. THE LUXURY "S" MONOGRAM EMBLEM -->
  <g id="letter-S-monogram">
    <!-- Top Wing Base Shadow -->
    <path
      d="M 370 120 
         L 220 120 
         C 152 120 108 165 108 222 
         C 108 262 135 292 185 316 
         L 282 250 
         C 230 226 186 210 186 182 
         C 186 156 208 146 242 146 
         L 348 146 
         Z"
      fill="#02060f"
      opacity="0.6"
    />

    <!-- Top Wing Main Titanium Body -->
    <path
      d="M 378 112 
         L 225 112 
         C 150 112 105 160 105 220 
         C 105 264 136 296 190 322 
         L 292 252 
         C 236 226 188 208 188 178 
         C 188 152 210 142 246 142 
         L 354 142 
         L 378 112 Z"
      fill="url(#sefronTitaniumSurface)"
      stroke="url(#sefronPlatinumRim)"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Top Wing High-Luster Upper Facet Bevel -->
    <path
      d="M 378 112 
         L 225 112 
         C 150 112 105 160 105 220 
         L 138 205 
         C 138 162 166 136 225 136 
         L 358 136 
         L 378 112 Z"
      fill="url(#sefronElectricCyan)"
      opacity="0.92"
    />

    <!-- Top Wing Dynamic Highlight Ridge -->
    <path
      d="M 365 118 
         L 225 118 
         C 162 118 122 156 122 208"
      stroke="url(#sefronSpecularGlint)"
      stroke-width="3.5"
      stroke-linecap="round"
    />

    <!-- Bottom Wing Base Shadow -->
    <path
      d="M 130 380 
         L 280 380 
         C 348 380 392 335 392 278 
         C 392 238 365 208 315 184 
         L 218 250 
         C 270 274 314 290 314 318 
         C 314 344 292 354 258 354 
         L 152 354 
         Z"
      fill="#02060f"
      opacity="0.6"
    />

    <!-- Bottom Wing Main Titanium Body -->
    <path
      d="M 122 388 
         L 275 388 
         C 350 388 395 340 395 280 
         C 395 236 364 204 310 178 
         L 208 248 
         C 264 274 312 292 312 322 
         C 312 348 290 358 254 358 
         L 146 358 
         L 122 388 Z"
      fill="url(#sefronTitaniumSurface)"
      stroke="url(#sefronPlatinumRim)"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Bottom Wing High-Luster Lower Facet Bevel -->
    <path
      d="M 122 388 
         L 275 388 
         C 350 388 395 340 395 280 
         L 362 295 
         C 362 338 334 364 275 364 
         L 142 364 
         L 122 388 Z"
      fill="url(#sefronElectricCyanRev)"
      opacity="0.92"
    />

    <!-- Bottom Wing Dynamic Highlight Ridge -->
    <path
      d="M 135 382 
         L 275 382 
         C 338 382 378 344 378 292"
      stroke="url(#sefronSpecularGlint)"
      stroke-width="3.5"
      stroke-linecap="round"
    />

    <!-- Central Energy Ribbon Nexus -->
    <path
      d="M 174 275 
         L 236 215 
         L 326 225 
         L 264 285 Z"
      fill="url(#sefronElectricCyan)"
      stroke="url(#sefronPlatinumRim)"
      stroke-width="1.5"
      filter="url(#sefronCoreGlow)"
    />

    <!-- Floating Core Precision Diamond Jewel -->
    <polygon
      points="250,224 276,250 250,276 224,250"
      fill="#ffffff"
      stroke="#00f5ff"
      stroke-width="2"
      opacity="0.9"
      filter="url(#sefronCoreGlow)"
    />

    <polygon
      points="250,238 258,250 250,262 242,250"
      fill="#00f5ff"
    />

    <!-- Specular Starburst Flares -->
    <g transform="translate(378, 112)">
      <ellipse cx="0" cy="0" rx="9" ry="2" fill="#ffffff" transform="rotate(30)" />
      <ellipse cx="0" cy="0" rx="9" ry="2" fill="#ffffff" transform="rotate(-60)" />
      <circle cx="0" cy="0" r="2.5" fill="#00f5ff" />
    </g>

    <g transform="translate(122, 388)">
      <ellipse cx="0" cy="0" rx="9" ry="2" fill="#ffffff" transform="rotate(-30)" />
      <ellipse cx="0" cy="0" rx="9" ry="2" fill="#ffffff" transform="rotate(60)" />
      <circle cx="0" cy="0" r="2.5" fill="#00f5ff" />
    </g>
  </g>
</svg>
